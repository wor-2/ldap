# ─── Production overrides ─────────────────────────────────────────────────────
# All sensitive values loaded from environment variables / Docker secrets

# LDAP
ldap.host=${LDAP_HOST:openldap}
ldap.port=${LDAP_PORT:636}
ldap.bind-dn=${LDAP_BIND_DN}
ldap.bind-password=${LDAP_BIND_PASSWORD}
ldap.base-dn=${LDAP_BASE_DN}
ldap.pool-min-size=5
ldap.pool-max-size=20

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.server.port=8081

# Logging
logging.level.com.admanager=INFO
logging.level.com.unboundid=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
