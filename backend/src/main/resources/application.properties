# ─── LDAP ─────────────────────────────────────────────────────────────────────
ldap.host=${LDAP_HOST:localhost}
ldap.port=${LDAP_PORT:636}
ldap.bind-dn=${LDAP_BIND_DN:cn=admin,dc=admanager,dc=local}
ldap.bind-password=${LDAP_BIND_PASSWORD:Admin@1234}
ldap.base-dn=${LDAP_BASE_DN:dc=admanager,dc=local}
ldap.users-ou=ou=Users,dc=admanager,dc=local
ldap.groups-ou=ou=Groups,dc=admanager,dc=local
ldap.superusers-ou=ou=SuperUsers,dc=admanager,dc=local
ldap.trust-all-certs=true
ldap.pool-min-size=2
ldap.pool-max-size=10

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:YWRtYW5hZ2Vyc2VjcmV0a2V5Zm9yanNvbndlYnRva2VuMzI=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/admanagerdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:admanager}
spring.datasource.password=${POSTGRES_PASSWORD:AdManager@1234}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# SQL init
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ─── Spring Boot Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.admanager=DEBUG
logging.level.com.unboundid=WARN
logging.level.org.springframework.security=DEBUG
