version: '3.8'

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: admanager-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: admanagerdb
      POSTGRES_USER: admanager
      POSTGRES_PASSWORD: AdManager@1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admanager -d admanagerdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admanager-net
    restart: unless-stopped

  # ─── pgAdmin (optional web UI for PostgreSQL) ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: admanager-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admanager.local
      PGADMIN_DEFAULT_PASSWORD: Admin@1234
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - admanager-net
    restart: unless-stopped

  # ─── OpenLDAP ─────────────────────────────────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap-ad
    hostname: openldap
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ORGANISATION: "AD Manager"
      LDAP_DOMAIN: "admanager.local"
      LDAP_BASE_DN: "dc=admanager,dc=local"
      LDAP_ADMIN_USERNAME: "admin"
      LDAP_ADMIN_PASSWORD: "Admin@1234"
      LDAP_CONFIG_PASSWORD: "Config@1234"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_TLS_CIPHER_SUITE: "NORMAL:!VERS-SSL3.0"
      LDAP_READONLY_USER: "false"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      KEEP_EXISTING_CONFIG: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service --loglevel warning
    networks:
      - admanager-net
    restart: unless-stopped

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    hostname: phpldapadmin
    ports:
      - "8081:443"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "true"
    depends_on:
      - openldap
    networks:
      - admanager-net
    restart: unless-stopped

volumes:
  openldap-data:
    driver: local
  openldap-config:
    driver: local
  postgres-data:
    driver: local

networks:
  admanager-net:
    driver: bridge
